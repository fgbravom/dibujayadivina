# Plantilla de Fly.io para Dibuja y Adivina. Guía completa en docs/despliegue.md.
#
# `app` es el subdominio <app>.fly.dev. Con `fly launch --no-deploy --copy-config`
# Fly conserva este archivo y registra la app.
app = "dibujayadivina"

# Santiago de Chile (scl), por latencia. CONFIRMAR que la región exista en tu cuenta
# (`fly platform regions`). Si no aparece, usar `gru` (São Paulo) o la región
# sudamericana más cercana que muestre esa lista.
primary_region = "scl"

[build]
  dockerfile = "Dockerfile"

[env]
  # PORT debe coincidir con internal_port; HOST, NODE_ENV y WEB_DIR ya vienen en la imagen.
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true

  # El estado de las partidas vive en la memoria de un solo proceso: nunca más de una máquina.
  # Con "off" la máquina no se apaga sola ni siquiera sin tráfico, así no se pierden salas
  # abiertas; cuesta una máquina encendida todo el mes. Con "stop" Fly la apaga cuando no hay
  # conexiones (más barato, pero se pierden las salas vacías y el primer visitante espera el
  # arranque en frío). Para partidas con amigos conviene "off".
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # Un solo proceso aguanta cientos de conexiones de Socket.IO; el límite evita saturarlo.
  [http_service.concurrency]
    type = "connections"
    soft_limit = 400
    hard_limit = 500

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    protocol = "http"
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
